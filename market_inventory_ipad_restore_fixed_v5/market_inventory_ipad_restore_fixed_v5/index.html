<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Market Inventory</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#15803d;--green2:#dcfce7;--red:#b91c1c;--red2:#fee2e2;--blue:#1d4ed8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{max-width:1100px;margin:auto;padding:16px}.small{color:var(--muted);font-size:14px}h1{margin:0}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn,input{font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px 14px}button,.btn{background:white;font-weight:700}
.primary{background:var(--blue);color:white;border-color:var(--blue)}.good{background:var(--green2);color:#166534}.bad{background:var(--red2);color:#991b1b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat,.panel,.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:30px}.addbar{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.item-top{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:start}.photo,.photo-placeholder{width:110px;height:110px;border-radius:14px;border:1px solid var(--line)}
.photo{object-fit:cover}.photo-placeholder{display:flex;align-items:center;justify-content:center;background:#f8fafc;color:var(--muted);font-size:12px;text-align:center}
.item-name{font-size:22px;font-weight:800}.qty{font-size:38px;font-weight:900}.qty-label{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button{min-height:58px;font-size:20px}
.custom{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;margin-top:8px}.custom input{text-align:center}
.item-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button.active{background:#111827;color:white}.hidden{display:none!important}
.search{width:100%}.history{width:100%;border-collapse:collapse}.history th,.history td{padding:9px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:760px){header{align-items:flex-start;flex-direction:column}.grid,.cards{grid-template-columns:1fr}.addbar{grid-template-columns:1fr 95px}.addbar .btn,.addbar button{grid-column:1/-1}.item-top{grid-template-columns:90px 1fr auto}.photo,.photo-placeholder{width:90px;height:90px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Market Inventory</h1><div class="small">Offline item-in / item-out tracker</div></div>
<div class="toolbar"><button id="exportBtn" type="button">Backup</button><button id="restoreBtn" type="button">Restore Backup</button><input id="importFile" class="hidden" type="file" accept=".json,application/json"><span id="restoreStatus" class="small"></span></div></header>

<div class="grid">
<div class="stat">Different Items<b id="itemCount">0</b></div>
<div class="stat">Units On Hand<b id="totalUnits">0</b></div>
<div class="stat">Moved Out Today<b id="outToday">0</b></div>
</div>

<div class="panel">
<div class="addbar">
<input id="newName" placeholder="Item name">
<input id="newQty" type="number" min="0" value="0">
<label class="btn" for="newPhoto">Add Picture</label>
<input id="newPhoto" class="hidden" type="file" accept="image/*" capture="environment">
<button class="primary" id="addBtn" type="button">Add Item</button>
</div>
<div id="newPhotoName" class="small" style="margin-top:8px">No picture selected</div>
</div>

<div class="tabs"><button class="active" data-tab="inventory">Inventory</button><button data-tab="history">History</button></div>

<section id="inventoryTab"><input id="search" class="search" placeholder="Search items..."><div id="cards" class="cards"></div></section>
<section id="historyTab" class="hidden"><div class="panel"><div class="toolbar" style="justify-content:space-between"><b>Movement History</b><button class="bad" id="clearHistory">Clear History</button></div><div id="historyWrap"></div></div></section>
</div>

<script>
const DB_NAME='market_inventory_db', DB_VERSION=2; let db, pendingPhoto=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('items')){const s=d.createObjectStore('items',{keyPath:'id',autoIncrement:true});s.createIndex('name','name',{unique:false})}if(!d.objectStoreNames.contains('movements')){const s=d.createObjectStore('movements',{keyPath:'id',autoIncrement:true});s.createIndex('createdAt','createdAt',{unique:false})}};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e.target.error)})}
function store(n,m='readonly'){return db.transaction(n,m).objectStore(n)}function all(n){return new Promise((res,rej)=>{const r=store(n).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(n,o){return new Promise((res,rej)=>{const r=store(n,'readwrite').put(o);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function add(n,o){return new Promise((res,rej)=>{const r=store(n,'readwrite').add(o);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(n,id){return new Promise((res,rej)=>{const r=store(n,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearStore(n){return new Promise((res,rej)=>{const r=store(n,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function todayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(r.error);
    r.readAsDataURL(file);
  });
}
async function preparePhoto(file){
  if(!file) return null;
  // Store the original image data directly.
  // This avoids the iPad/Safari canvas bug that can turn HEIC/camera photos black.
  return await fileToDataURL(file);
}

async function render(){
 const items=(await all('items')).sort((a,b)=>a.name.localeCompare(b.name)), moves=await all('movements');
 itemCount.textContent=items.length; totalUnits.textContent=items.reduce((s,i)=>s+i.quantity,0);
 outToday.textContent=moves.filter(m=>m.direction==='OUT'&&todayKey(new Date(m.createdAt))===todayKey()).reduce((s,m)=>s+m.amount,0);
 const q=search.value.toLowerCase().trim(), filtered=items.filter(i=>i.name.toLowerCase().includes(q)); cards.innerHTML='';
 for(const item of filtered){
  const el=document.createElement('div');el.className='item';
  el.innerHTML=`<div class="item-top"><div class="photoSlot">${item.photo?'<img class="photo">':'<div class="photo-placeholder">No picture</div>'}</div>
  <div><div class="item-name"></div><div class="small">Tap SOLD when one leaves the table.</div>
  <div class="toolbar" style="margin-top:8px"><label class="btn" for="photo-${item.id}">${item.photo?'Change Picture':'Add Picture'}</label><input id="photo-${item.id}" class="hidden photoInput" type="file" accept="image/*" capture="environment">${item.photo?'<button class="removePhoto">Remove Picture</button>':''}</div></div>
  <div style="text-align:right"><div class="qty">${item.quantity}</div><div class="qty-label">on hand</div></div></div>
  <div class="actions"><button class="good in1">+1 IN</button><button class="bad out1">SOLD -1</button></div>
  <div class="custom"><input class="customQty" type="number" min="1" value="1"><button class="good cin">IN</button><button class="bad cout">OUT</button></div>
  <div class="item-foot"><span>${item.quantity===0?'<b style="color:#b91c1c">OUT OF STOCK</b>':''}</span><button class="deleteBtn">Delete Item</button></div>`;
  el.querySelector('.item-name').textContent=item.name;if(item.photo)el.querySelector('.photo').src=item.photo;
  el.querySelector('.in1').onclick=()=>adjust(item.id,1,'IN'); el.querySelector('.out1').onclick=()=>adjust(item.id,1,'OUT');
  el.querySelector('.cin').onclick=()=>adjust(item.id,parseInt(el.querySelector('.customQty').value||1),'IN');
  el.querySelector('.cout').onclick=()=>adjust(item.id,parseInt(el.querySelector('.customQty').value||1),'OUT');
  el.querySelector('.photoInput').onchange=async e=>{const f=e.target.files[0];if(f){item.photo=await preparePhoto(f);await put('items',item);render()}};
  const rp=el.querySelector('.removePhoto');if(rp)rp.onclick=async()=>{delete item.photo;await put('items',item);render()};
  el.querySelector('.deleteBtn').onclick=async()=>{if(confirm('Delete '+item.name+'?')){await del('items',item.id);for(const m of (await all('movements')).filter(x=>x.itemId===item.id))await del('movements',m.id);render()}};
  cards.appendChild(el);
 }
 renderHistory(moves);
}
async function adjust(id,amount,direction){amount=Math.max(1,Number(amount)||1);const items=await all('items'),item=items.find(i=>i.id===id);if(direction==='OUT'&&amount>item.quantity){alert('Only '+item.quantity+' on hand.');return}item.quantity+=direction==='IN'?amount:-amount;await put('items',item);await add('movements',{itemId:id,itemName:item.name,direction,amount,balanceAfter:item.quantity,createdAt:new Date().toISOString()});render()}
function renderHistory(moves){const rows=[...moves].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));historyWrap.innerHTML=rows.length?'<table class="history"><thead><tr><th>Date</th><th>Item</th><th>Move</th><th>Qty</th><th>Balance</th></tr></thead><tbody>'+rows.map(m=>`<tr><td>${new Date(m.createdAt).toLocaleString()}</td><td>${m.itemName}</td><td>${m.direction}</td><td>${m.amount}</td><td>${m.balanceAfter}</td></tr>`).join('')+'</tbody></table>':'<div class="small">No movement history yet.</div>'}
const itemCount=document.getElementById('itemCount');
const totalUnits=document.getElementById('totalUnits');
const outToday=document.getElementById('outToday');
const search=document.getElementById('search');
const cards=document.getElementById('cards');
const historyWrap=document.getElementById('historyWrap');
const newPhoto=document.getElementById('newPhoto');
const newPhotoName=document.getElementById('newPhotoName');
const addBtn=document.getElementById('addBtn');
const newName=document.getElementById('newName');
const newQty=document.getElementById('newQty');
const inventoryTab=document.getElementById('inventoryTab');
const historyTab=document.getElementById('historyTab');
const clearHistory=document.getElementById('clearHistory');
const exportBtn=document.getElementById('exportBtn');
const importFile=document.getElementById('importFile');
const restoreBtn=document.getElementById('restoreBtn');
const restoreStatus=document.getElementById('restoreStatus');

newPhoto.onchange=async e=>{const f=e.target.files[0];pendingPhoto=f?await preparePhoto(f):null;newPhotoName.textContent=f?'Picture selected: '+f.name:'No picture selected'}
addBtn.addEventListener('click',async()=>{try{const name=newName.value.trim();const quantity=Math.max(0,parseInt(newQty.value||'0',10)||0);if(!name){alert('Enter an item name.');newName.focus();return;}const existing=await all('items');if(existing.some(i=>String(i.name).toLowerCase()===name.toLowerCase())){alert('That item already exists.');return;}const obj={name,quantity};if(pendingPhoto)obj.photo=pendingPhoto;const id=await add('items',obj);if(quantity>0){await add('movements',{itemId:id,itemName:name,direction:'IN',amount:quantity,balanceAfter:quantity,createdAt:new Date().toISOString()});}newName.value='';newQty.value='0';newPhoto.value='';pendingPhoto=null;newPhotoName.textContent='No picture selected';await render();}catch(err){console.error(err);alert('Could not add the item. Please try again.');}})
search.oninput=render;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const inv=b.dataset.tab==='inventory';inventoryTab.classList.toggle('hidden',!inv);historyTab.classList.toggle('hidden',inv)})
clearHistory.onclick=async()=>{if(confirm('Clear all movement history?')){await clearStore('movements');render()}}
exportBtn.onclick=async()=>{const data={version:2,exportedAt:new Date().toISOString(),items:await all('items'),movements:await all('movements')};const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='market-inventory-backup-'+todayKey()+'.json';a.click();URL.revokeObjectURL(url)}
restoreBtn.addEventListener('click',()=>{restoreStatus.textContent='';importFile.value='';importFile.click();});
function readFileAsText(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(r.error||new Error('Could not read file'));r.readAsText(file);});}
async function restoreBackupData(data){
 if(!data||!Array.isArray(data.items))throw new Error('Backup does not contain an items list.');
 if(!Array.isArray(data.movements))data.movements=[];
 const cleanItems=[];
 for(const raw of data.items){
  if(!raw||typeof raw.name!=='string'||!raw.name.trim())continue;
  const item={name:raw.name.trim(),quantity:Math.max(0,Number(raw.quantity)||0)};
  if(raw.id!==undefined&&raw.id!==null&&Number.isFinite(Number(raw.id)))item.id=Number(raw.id);
  if(typeof raw.photo==='string'&&raw.photo.length>0)item.photo=raw.photo;
  cleanItems.push(item);
 }
 if(!cleanItems.length&&data.items.length)throw new Error('No valid items were found in the backup.');
 const cleanMoves=[];
 for(const raw of data.movements){
  if(!raw)continue;
  const m={itemName:String(raw.itemName||''),direction:raw.direction==='IN'?'IN':'OUT',amount:Math.max(1,Number(raw.amount)||1),balanceAfter:Math.max(0,Number(raw.balanceAfter)||0),createdAt:raw.createdAt||new Date().toISOString()};
  if(raw.id!==undefined&&raw.id!==null&&Number.isFinite(Number(raw.id)))m.id=Number(raw.id);
  if(raw.itemId!==undefined&&raw.itemId!==null&&Number.isFinite(Number(raw.itemId)))m.itemId=Number(raw.itemId);
  cleanMoves.push(m);
 }
 await clearStore('movements');await clearStore('items');
 for(const i of cleanItems)await put('items',i);
 for(const m of cleanMoves)await put('movements',m);
 return {items:cleanItems.length,movements:cleanMoves.length};
}
importFile.addEventListener('change',async e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;
 restoreStatus.textContent='Reading backup…';
 try{
  const text=await readFileAsText(f);let data;
  try{data=JSON.parse(text);}catch{throw new Error('That file is not a valid inventory backup.');}
  if(!confirm('Replace the current inventory with this backup?')){restoreStatus.textContent='Restore canceled.';return;}
  restoreStatus.textContent='Restoring…';
  const result=await restoreBackupData(data);await render();
  restoreStatus.textContent=`Restored ${result.items} items.`;
  alert(`Restore complete.\n\nItems restored: ${result.items}\nHistory records restored: ${result.movements}`);
 }catch(err){
  console.error(err);restoreStatus.textContent='Restore failed.';
  alert('Could not restore this backup.\n\n'+(err&&err.message?err.message:'Unknown error'));
 }finally{importFile.value='';}
});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));openDB().then(render)
</script>
</body></html>
